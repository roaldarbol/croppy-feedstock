schema_version: 1

context:
  version: "0.6.0"
  python_min: "3.12"

package:
  name: croppy
  version: ${{ version }}

source:
  url: https://github.com/roaldarbol/croppy/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 337828b3d8527788338bafd0dd35c6c4f57f18a83aba879a820fb0775d622560

build:
  number: 1
  noarch: python
  python:
    entry_points:
      - croppy = croppy.cli:app

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pyside6 >=6.7
    - qt6-multimedia
    - typer >=0.12
    - loguru >=0.7
    - ffmpeg
    - menuinst >=2

tests:
  - python:
      imports:
        - croppy
        - PySide6.QtMultimedia
        - PySide6.QtMultimediaWidgets
      python_version: ${{ python_min }}.*
  - script:
      - croppy --version

about:
  homepage: https://github.com/roaldarbol/croppy
  repository: https://github.com/roaldarbol/croppy
  summary: Visual GUI for cropping, combining, and compressing videos via ffmpeg.
  description: |
    Croppy is a desktop app for cropping, combining, and compressing videos,
    built on ffmpeg and Qt (PySide6). It provides a Crop / Combine / Compress
    workflow with a queued job system.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - roaldarbol
